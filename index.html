<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recomendador de cine</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="contenedor">

    <h1>¡Bienvenidos al cine de Kevin Oswaldo Arredondo Arias!</h1>
    <h2>--- Menú ---</h2>
    <p class="intro">
      Queremos hacer de tu visita una experiencia más placentera. Para eso, ingresa tu edad
      y selecciona el género que más te guste, y te recomendamos tu película ideal.
    </p>

    <label for="edad">Edad:</label>
    <input type="number" id="edad" min="2" max="120" placeholder="Ej. 20">

    <div class="generos">
      <button data-genero="Drama">Drama</button>
      <button data-genero="Comedia">Comedia</button>
      <button data-genero="Musical">Musical</button>
      <button data-genero="Crimen">Crimen</button>
      <button data-genero="Terror">Terror</button>
    </div>

    <p id="error"></p>

    <h3>Nuestra recomendación:</h3>

    <section class="tarjeta" id="tarjeta" hidden>
      <div class="poster-caja">
        <img id="poster" alt="Póster de la película">
        <div id="sinPoster" class="sin-poster" hidden></div>
      </div>
      <div class="info">
        <h4 id="resultado"></h4>
        <span class="insignia" id="clasificacion"></span>
        <p id="edadRec"></p>
        <p id="nota"></p>
      </div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
